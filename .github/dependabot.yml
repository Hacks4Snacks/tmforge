version: 2

updates:
  # .NET packages (central versions live in Directory.Packages.props).
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        versions: [">=3.0.0"]
    groups:
      nuget:
        patterns: ["*"]

  # Studio SPA (React/Vite) dependencies.
  - package-ecosystem: npm
    directory: "/src/ThreatModelForge.Studio"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/src/ThreatModelForge.Vscode"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
      - dependency-name: "@types/vscode"
        versions: [">=1.139.0"]
    groups:
      npm:
        patterns: ["*"]

  # Base images in build/Dockerfile and build/Dockerfile.api.
  - package-ecosystem: docker
    directory: "/build"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]

  # Pinned action versions in .github/workflows/*.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
